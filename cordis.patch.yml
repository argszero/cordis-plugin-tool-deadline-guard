# The @argszero/cordis-plugin-tool-deadline-guard bundle patch.
#
# It needs no deployment-specific config to mount. With an empty config the
# guard bounds every tool that declares no `timeoutMs` of its own at ten
# minutes, and leaves every other tool alone.
#
#   - insert:
#       - id: tool-deadline-guard
#         config:
#           # mode: auto          # auto (default) arms; observe only reports; off does nothing
#           # defaultTimeoutMs: 600000   # budget for a tool that declares none (10 minutes)
#           # perTool: { mcp__slow_server__query: 120000 }
#           # exempt: [ workflow ]       # names this mount never bounds
#           # applyTo: undeclared         # or `all` to bound declared tools too (see README)
#           # onExpiry: cooperative       # or `replace` to return at the deadline (see README)
#           # warnLimit: 5                # diagnostics per mount; 0 silences them
#
# Inside a bundle whose patch already has rows, add the same `insert` entry
# instead of a second document.

- insert:
    - id: tool-deadline-guard
      name: '@argszero/cordis-plugin-tool-deadline-guard'
